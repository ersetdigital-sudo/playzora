<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af6a"/>
      <stop offset="100%" stop-color="#a8813f"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#0c0b0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4af6a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4af6a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="624" fill="url(#bgGrad)"/>
  
  <!-- Glow effect -->
  <ellipse cx="600" cy="250" rx="500" ry="300" fill="url(#glow)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="624" stroke="#d4af6a" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#d4af6a" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#d4af6a" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#d4af6a" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#d4af6a" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#d4af6a" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#d4af6a" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#d4af6a" stroke-width="1"/>
  </g>
  
  <!-- Brand name -->
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2">Toplixa</text>
  
  <!-- Tagline -->
  <text x="600" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#9a9a9f" text-anchor="middle">Top Up Game Instan, Aman &amp; Murah</text>
  
  <!-- Features -->
  <g fill="#ffffff" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="16">
    <text x="320" y="440" text-anchor="middle">Proses Instan</text>
    <text x="480" y="440" text-anchor="middle">•</text>
    <text x="600" y="440" text-anchor="middle">24 Jam</text>
    <text x="720" y="440" text-anchor="middle">•</text>
    <text x="880" y="440" text-anchor="middle">QRIS &amp; E-Wallet</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="400" y="480" width="400" height="2" rx="1" fill="url(#goldGrad)" opacity="0.5"/>
  
  <!-- URL -->
  <text x="600" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#d4af6a" text-anchor="middle" opacity="0.8">toplixa.com</text>
</svg>
